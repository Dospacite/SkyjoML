[project]
name = "skyjo-ml"
version = "0.2.0"
description = "Reproducible Skyjo simulator, training pipeline, benchmark suite and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<2.4",
    "numba>=0.61",
    "torch>=2.5",
    "pyarrow>=17",
]

[project.optional-dependencies]
aec = ["pettingzoo>=1.24", "gymnasium>=1.0"]

[project.scripts]
skyjo = "skyjo_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pettingzoo>=1.24",
    "gymnasium>=1.0",
    "pandas>=3.0.6",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyjo_ml"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running randomized gates"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E501"]
